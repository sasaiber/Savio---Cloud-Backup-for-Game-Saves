<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512" fill="none">
  <defs>
    <linearGradient id="savio-bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#C62828"/>
      <stop offset="55%" stop-color="#E53935"/>
      <stop offset="100%" stop-color="#FF7043"/>
    </linearGradient>
    <filter id="savio-shadow" x="-10%" y="-10%" width="120%" height="130%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#000000" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Modern Squircle Container -->
  <rect x="24" y="24" width="464" height="464" rx="108" fill="url(#savio-bg-grad)"/>
  <rect x="25" y="25" width="462" height="462" rx="107" fill="none" stroke="#FFFFFF" stroke-opacity="0.22" stroke-width="2"/>

  <!-- Cloud Gamepad Symbol centered at 512x512 -->
  <g transform="translate(256, 254) scale(3.3) translate(-50, -50)" filter="url(#savio-shadow)">
    <!-- Outer cloud-gamepad silhouette -->
    <path d="M 32 36 C 24 36, 18 42, 18 50 C 18 64, 25 82, 33 82 C 38 82, 42 74, 46 70 C 48 68, 52 68, 54 70 C 58 74, 62 82, 67 82 C 75 82, 82 64, 82 50 C 82 42, 76 36, 68 36 C 67 36, 65 37, 64 38 C 61 27, 51 20, 39 24 C 34 26, 31 30, 32 36 Z" 
          fill="#FFFFFF" fill-opacity="0.16" stroke="#FFFFFF" stroke-width="7" stroke-linejoin="round" stroke-linecap="round"/>
    
    <!-- D-pad cross on left -->
    <path d="M 32 46 L 32 58 M 26 52 L 38 52" stroke="#FFFFFF" stroke-width="4.5" stroke-linecap="round"/>
    
    <!-- Action buttons on right -->
    <circle cx="68" cy="48" r="3.2" fill="#FFFFFF"/>
    <circle cx="62" cy="54" r="3.2" fill="#FFFFFF"/>
    
    <!-- Central upward cloud sync arrow -->
    <path d="M 50 36 L 50 52 M 45 42 L 50 36 L 55 42" stroke="#FFFFFF" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
</svg>
