[package]
name = "savio"
version = "0.1.0"
description = "Savio — open-source cloud game save manager for Windows 11"
authors = ["Savio contributors"]
license = "GPL-3.0-or-later"
edition = "2021"
rust-version = "1.80"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sys-locale = "0.3"
windows-sys = { version = "0.59", features = [
  "Win32_Foundation",
  "Win32_Graphics_Dwm",
  "Win32_System_Diagnostics_ToolHelp",
  "Win32_System_Registry",
  "Win32_System_SystemInformation",
  "Win32_System_Threading",
  "Win32_UI_Shell",
  "Win32_UI_WindowsAndMessaging",
] }

# Standard, stable release build: fast and rock-solid on Windows 11 MSVC.
[profile.release]
opt-level = 2
lto = false
codegen-units = 16
strip = false
panic = "unwind"
